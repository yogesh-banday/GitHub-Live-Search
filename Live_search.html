<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Live_search.css" />
  </head>
  <body>
    <div class="bb">
      <div class="header">
        <div class="logo">
          <p>yogifinder</p>
          <p>💀</p>
        </div>
      </div>
      <div class="search-bar">
        <!-- <img src="search.png" alt=""> -->
        <input id="username" />
        <button id="search">Search</button>
      </div>
      <div class="searching not-found catch">
        <div class="pop-up"></div>
      </div>
      <div class="card">
        <div class="dp"></div>
        <div class="info">
          <div class="info-card">
            <div id="name"></div>
            <div id="username1"></div>
            <p id="bio"></p>
            <!-- <div class="bio"><p id="bio"></p></div> -->
            <div class="reach_1">
              <div class="repo_name"></div>
              <div class="follower_name"></div>
              <div class="following_name"></div>
            </div>
            <div class="reach">
              <div class="repo"></div>
              <div class="follower"></div>
              <div class="following"></div>
            </div>
            <div class="remaining_things">
              <div class="loacation"></div>
              <div class="github_link"></div>
              <div class="twitter"></div>
              <div class="email"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="result"></div>
    </div>
    <script src="Live_search.js"></script>
  </body>
</html>
